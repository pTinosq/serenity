[project]
name = "serenity"
version = "0.1.0"
description = "serenity"
readme = "README.md"
authors = [
    { name = "Constantinos", email = "constantinos@arrakis.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
serenity = "serenity.main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "watchfiles>=1.2.0",
]
